<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ines gille rodriguez</title>
<meta name="description" content="portfolio — ines gille rodriguez, architecture">
<meta property="og:title" content="ines gille rodriguez">
<meta property="og:description" content="portfolio">
<meta property="og:image" content="images/image02.jpg">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M3%202v18l5-5%203.5%207%203-1.5L11%2013.5h7z%22%20fill%3D%22%23e10600%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.2%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Système unique, basé sur une page de référence de 1280 px.
     Les valeurs --s-… (tailles, espacements) et les couleurs viennent du back office
     (page « Apparence », enregistrées dans content.js) ; les nombres ci-dessous sont les valeurs par défaut.
     --u = 1 px de référence : il grandit avec l'écran au-delà de 1280 px,
     pour que texte, marges et images gardent les mêmes proportions. */
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --muted: #8a8a8a;
    --line: #000000;
    --hover: #F27E7E;
    --u: clamp(1px, calc(100vw / 1280), 1.3px);
    --zone: calc(1080 * var(--u));  /* largeur max de la zone d'images, centrée */

    /* quatre tailles de texte, partout */
    --t-s: calc(var(--s-ts, 12) * var(--u));     /* texte courant, légendes, fiches */
    --t-m: calc(var(--s-tm, 15) * var(--u));     /* lignes de sous-titre, liens, intertitres */
    --t-ml: calc(var(--s-tml, 21) * var(--u));   /* sous-titre principal */
    --t-l: calc(var(--s-tl, 42) * var(--u));     /* titres de projet */
    --t-h: calc(var(--s-th, 16.5) * var(--u));   /* en-tête (nom + menu) */
    --lh: 1.25;

    /* espacements */
    --side: calc(var(--s-side, 72) * var(--u));    /* marge gauche / droite, partout */
    --top: calc(var(--s-top, 48) * var(--u));      /* espace sous l'en-tête, partout */
    --block: calc(var(--s-block, 120) * var(--u)); /* espace entre grands blocs */
    --row: calc(var(--s-row, 48) * var(--u));      /* espace entre rangées d'images */
    --ggap: calc(var(--s-ggap, 64) * var(--u));    /* espace vertical entre images d'un projet */
    --textw: calc(var(--s-textw, 550) * var(--u)); /* largeur du texte (projets, info) */
    --fichew: calc(var(--s-fichew, 300) * var(--u)); /* largeur de la fiche technique */
    --font: "Rethink Sans";
    --tw: 600;                                     /* graisse des titres */
    --pad: calc(9 * var(--u));      /* hauteur des lignes à filet */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), system-ui, sans-serif;
    font-size: var(--t-s);
    line-height: var(--lh);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; transition: color .15s; }
  a:hover { color: var(--hover); }
  img { display: block; width: 100%; height: auto; }

  /* --- en-tête : nom à gauche, trois colonnes alignées à droite --- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr repeat(3, calc(227 * var(--u)));
    align-items: baseline;
    padding: calc(27 * var(--u)) var(--side) calc(22 * var(--u));
    font-size: var(--t-h); font-weight: 700; line-height: 1.5;
  }
  header nav { display: contents; }
  header nav a { text-align: right; }
  header nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 0.25em; }

  main { min-height: 70vh; }
  .view { display: none; padding-top: var(--top); }
  .view.active { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  /* lignes à filet : même style pour l'index et les fiches techniques */
  .ruled > * { padding: var(--pad) 0; }
  .ruled > * + * { border-top: 1px solid var(--line); }

  /* --- atlas : rangées décalées ---
     --c : largeur de colonne, --w : largeur de l'image, --o : décalage vertical
     (en px sur une zone de 1080, convertis en %) */
  .atlas { max-width: calc(var(--zone) + 2 * var(--side)); margin: 0 auto; padding: 0 var(--side); }
  .atlas .row { display: flex; align-items: flex-start; gap: calc(48 / 1080 * 100%); }
  .atlas .row + .row { margin-top: var(--row); }
  /* alignement de la rangée, choisi dans le back office */
  .atlas .row.al-centre { justify-content: center; }
  .atlas .row.al-droite { justify-content: flex-end; }
  .atlas .row.al-reparti { justify-content: space-between; }
  .tile { flex: none; width: calc(var(--c) / 1080 * 100%); margin-top: calc(var(--o, 0) / 1080 * 100%); }
  .tile .pic { width: calc(var(--w) / var(--c) * 100%); background: #f3f3f3; }
  .tile .pic img, .tile .pic video { display: block; width: 100%; height: auto; transition: transform .6s ease; }
  .tile:hover { position: relative; z-index: 1; }
  /* curseur personnalisé (back office → Apparence → Curseur) */
  html { cursor: var(--cursor, auto); }
  a, button, video, .tile, tr.link { cursor: var(--cursor, pointer); }
  .tile:hover .pic img, .tile:hover .pic video { transform: scale(1.02); }   /* léger zoom au survol, qui déborde un peu du cadre */
  @media (prefers-reduced-motion: reduce) { .tile:hover .pic img, .tile:hover .pic video { transform: none; } }
  .tile span { display: block; margin-top: calc(15 * var(--u)); }

  /* --- index : mêmes filets que les fiches --- */
  .index-wrap { padding: 0 var(--side); }
  .index { width: 100%; border-collapse: collapse; }
  .index tr { border-top: 1px solid var(--line); }
  .index tr:last-child { border-bottom: 1px solid var(--line); }
  .index td { padding: var(--pad) calc(16 * var(--u)) var(--pad) 0; vertical-align: top; }
  .index td:first-child { width: 36%; }
  .index td:nth-child(2) { width: 24%; }
  .index td:last-child { text-align: right; padding-right: 0; white-space: nowrap; }
  .index tr.link { cursor: var(--cursor, pointer); }
  .index tr.link:hover td { color: var(--hover); }

  /* --- page projet --- */
  .project h2 { padding: 0 var(--side); font-size: var(--t-l); font-weight: var(--tw); line-height: 1.15; }
  /* en-tête de projet : titre 42 → sous-titre 21 → lignes / liens 15, espaces réguliers */
  .project .sub { padding: calc(8 * var(--u)) var(--side) 0; font-size: var(--t-m); line-height: 1.45; }
  .project .sub > div:first-child { font-size: var(--t-ml); line-height: 1.25; margin-bottom: calc(6 * var(--u)); }
  .project .sub > div:only-child { margin-bottom: 0; }
  .project .sub a { text-decoration: none; } /* liens du sous-titre : non soulignés, changent de couleur au survol */
  .project .gallery {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--ggap) calc(48 / 1080 * 100%); align-items: center;
    max-width: calc(var(--zone) + 2 * var(--side)); margin: 0 auto;
    padding: var(--block) var(--side) 0;
  }
  .project .gallery video { grid-column: 1 / -1; width: 100%; display: block; background: #000; }
  .project .gallery img:last-child:nth-child(odd) { grid-column: 1 / -1; width: calc(50% - 24 / 1080 * 100%); justify-self: center; }
  /* texte : même largeur que la page info ; fiche à droite */
  .project .cols {
    display: grid; grid-template-columns: minmax(0, var(--textw)) minmax(0, var(--fichew));
    gap: var(--top) calc(36 * var(--u)); align-items: start;
    justify-content: space-between;  /* texte à gauche, fiche calée à droite */
    max-width: calc(var(--zone) + 2 * var(--side)); margin: 0 auto;  /* aligné sur les images */
    padding: var(--block) var(--side) 0;
  }
  .project .more { display: inline-block; margin-top: calc(15 * var(--u)); text-decoration: underline; text-underline-offset: 0.25em; }
  .project .details > div { display: flex; justify-content: space-between; gap: calc(20 * var(--u)); }
  .project .details > div:first-child { padding-top: 0; }
  .project .details dt { flex: none; }
  .project .details dd { text-align: right; white-space: pre-line; }
  .back { display: block; max-width: calc(var(--zone) + 2 * var(--side)); margin: var(--top) auto 0; padding: 0 var(--side); color: var(--muted); }

  /* --- info : même colonne de texte que les projets --- */
  .info { max-width: calc(var(--textw) + 2 * var(--side)); padding: 0 var(--side); }
  .info h3 { font-size: var(--t-m); font-weight: 400; margin: calc(30 * var(--u)) 0 calc(10 * var(--u)); }
  .info ul { list-style: none; }
  .info li { margin-bottom: calc(4 * var(--u)); }
  .info li::before { content: "– "; }
  /* photo : en petit, en haut à droite de la page info */
  /* photo : dans la marge de droite, en face de la rubrique choisie (Expériences par défaut) */
  .info.has-photo { max-width: none; display: grid; grid-template-columns: minmax(0, var(--textw)) 1fr calc(var(--s-photo, 280) * var(--u)); }
  .info.has-photo > * { grid-column: 1; }
  .info.has-photo > .info-photo { grid-column: 3; align-self: start; width: 100%; height: auto; display: block; }

  /* --- pied de page : trois liens centrés --- */
  footer {
    margin-top: var(--block);
    padding: var(--top) var(--side) calc(56 * var(--u));
    display: flex; justify-content: center; gap: calc(160 * var(--u));
    text-align: center;
  }

  /* --- mobile --- */
  @media (max-width: 736px) {
    :root { --side: 16px; --top: 24px; --block: 40px; --row: 32px; --ggap: 16px;
            --t-l: calc(var(--s-tl, 42) * 0.72px); --t-ml: calc(var(--s-tml, 21) * 0.86px); }
    header { grid-template-columns: 1fr auto auto auto; gap: 16px; padding: 20px var(--side) 16px; font-size: 15px; }
    .atlas .row { flex-direction: column; gap: 0; }
    .atlas .tile + .tile { margin-top: var(--row); }
    .tile { width: 100%; margin-top: 0; }
    .tile .pic { width: 100%; }
    .project .gallery { grid-template-columns: 1fr; }
    .project .gallery img:last-child:nth-child(odd) { width: 100%; }
    .project .cols { grid-template-columns: 1fr; }
    .index, .index tbody, .index tr, .index td { display: block; width: auto !important; }
    .index tr { padding: 12px 0; }
    .index td { padding: 0; text-align: left !important; }
    .index td:first-child { font-weight: 700; margin-bottom: 4px; }
    .index td:not(:first-child) { color: var(--muted); display: inline; }
    .index td:not(:first-child):not(:empty) ~ td:not(:empty)::before { content: " · "; }
    footer { gap: 40px; }
    .info.has-photo { grid-template-columns: minmax(0, 1fr); }
    .info.has-photo > .info-photo { grid-column: 1; grid-row: auto !important; width: 160px; justify-self: end; margin: 16px 0 4px; }
  }
</style>
</head>
<body>

<header>
  <a href="#atlas" id="site-name"></a>
  <nav>
    <a href="#atlas" id="nav-atlas">atlas</a>
    <a href="#index" id="nav-index">index</a>
    <a href="#info" id="nav-info">info</a>
  </nav>
</header>

<main>
  <section id="view-atlas" class="view"><div class="atlas" id="atlas-grid"></div></section>
  <section id="view-index" class="view"><div class="index-wrap"><table class="index"><tbody id="index-list"></tbody></table></div></section>
  <section id="view-info" class="view"><div class="info" id="info"></div></section>
  <section id="view-project" class="view"><article class="project" id="project"></article></section>
</main>

<footer id="links"></footer>

<!-- Tout le contenu (textes, images, atlas, info, liens) est dans content.js.
     Pour le modifier, utilise le back office : double-clic sur « Back office.command ». -->
<script src="content.js"></script>
<script>
const C = window.CONTENT;
const PROJECTS = Object.fromEntries(C.projects.map(p => [p.id, p]));
const T = Object.assign({ atlas: "atlas", index: "index", info: "info", back: "← index", more: "Voir +" }, C.texts || {});

/* apparence (back office → Apparence) */
const FONTS = { "Rethink Sans": 1, "Inter": 1, "DM Sans": 1, "Space Grotesk": 1, "IBM Plex Sans": 1, "Work Sans": 1, "Manrope": 1, "Karla": 1, "Archivo": 1, "Instrument Sans": 1 };
// formes de curseur : [svg, point actif x, y]
function cursorSvg(kind, c) {
  const svg = (w, body) => `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${w}" viewBox="0 0 24 24">${body}</svg>`;
  const A = "M3 2v18l5-5 3.5 7 3-1.5L11 13.5h7z";
  return {
    "fleche": [svg(24, `<path d="${A}" fill="${c}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>`), 3, 2],
    "fleche-contour": [svg(24, `<path d="${A}" fill="#fff" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>`), 3, 2],
    "fleche-fine": [svg(24, `<path d="M3 2v13l3.6-3.4 2.6 6.4 1.6-.7-2.6-6.2H13z" fill="${c}"/>`), 3, 2],
    "point": [svg(20, `<circle cx="12" cy="12" r="6" fill="${c}"/>`), 10, 10],
    "cercle": [svg(28, `<circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-width="1.6"/>`), 14, 14],
    "croix": [svg(24, `<path d="M12 3v18M3 12h18" stroke="${c}" stroke-width="1.6"/>`), 12, 12]
  }[kind] || null;
}
function applyStyle(S) {
  S = S || {}; const r = document.documentElement.style;
  ["bg", "ink", "muted", "hover"].forEach(k => S[k] ? r.setProperty("--" + k, S[k]) : r.removeProperty("--" + k));
  if (S.ink) r.setProperty("--line", S.ink); else r.removeProperty("--line");
  ["ts", "tm", "tml", "tl", "th", "side", "top", "block", "row", "ggap", "textw", "fichew", "photo"].forEach(k =>
    S[k] !== undefined && S[k] !== "" ? r.setProperty("--s-" + k, Number(S[k])) : r.removeProperty("--s-" + k));
  S.titleWeight ? r.setProperty("--tw", S.titleWeight) : r.removeProperty("--tw");
  // curseur et icône de l'onglet
  const cur = cursorSvg(S.cursor || "fleche", S.cursorColor || "#e10600");
  if (cur) r.setProperty("--cursor", `url("data:image/svg+xml,${encodeURIComponent(cur[0])}") ${cur[1]} ${cur[2]}, auto`); else r.removeProperty("--cursor");
  const fav = document.getElementById("favicon");
  if (C.site.favicon) { fav.removeAttribute("type"); fav.href = "images/" + C.site.favicon; }
  else { fav.type = "image/svg+xml"; fav.href = "data:image/svg+xml," + encodeURIComponent((cur || cursorSvg("fleche", S.cursorColor || "#e10600"))[0]); }
  const font = S.font || "Rethink Sans";
  r.setProperty("--font", `"${font}"`);
  if (font !== "Rethink Sans" && FONTS[font] && !document.getElementById("font-" + font)) {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.id = "font-" + font;
    l.href = "https://fonts.googleapis.com/css2?family=" + font.replace(/ /g, "+") + ":wght@400;600;700&display=swap";
    document.head.append(l);
  }
}
applyStyle(C.style);
// aperçu en direct depuis le back office
window.addEventListener("message", e => { if (e.origin === location.origin && e.data && e.data.type === "preview-style") applyStyle(e.data.style); });

const isVideo = name => /\.(mp4|webm|m4v)$/i.test(name || "");
// image ou vidéo ; dans l'atlas (thumb), la vidéo tourne en boucle sans le son
function img(name, alt, thumb) {
  if (isVideo(name)) {
    const v = document.createElement("video");
    v.src = "images/" + name + "#t=0.1"; v.playsInline = true; v.preload = "metadata";
    if (thumb) { v.muted = true; v.loop = true; v.autoplay = true; } else v.controls = true;
    v.setAttribute("aria-label", alt || "");
    return v;
  }
  const el = document.createElement("img");
  el.src = "images/" + name; el.alt = alt || ""; el.loading = "lazy";
  return el;
}
function txt(tag, s, cls) { const e = document.createElement(tag); e.textContent = s || ""; if (cls) e.className = cls; return e; }

document.getElementById("site-name").textContent = C.site.name;
document.title = C.site.name;
["atlas", "index", "info"].forEach(k => document.getElementById("nav-" + k).textContent = T[k]);

/* atlas */
const grid = document.getElementById("atlas-grid");
C.atlas.forEach(rowItems => {
  const row = txt("div", "", "row");
  const align = (rowItems.find(t => t.align) || {}).align;
  if (align && align !== "gauche") row.classList.add("al-" + align);
  rowItems.forEach(t => {
    const p = PROJECTS[t.project];
    const a = document.createElement("a");
    a.className = "tile"; a.href = "#" + t.project;
    a.style.cssText = `--c:${t.col};--w:${t.width};--o:${t.offset}`;
    const pic = txt("div", "", "pic"); pic.append(img(t.image, p ? p.title : "", true));
    a.append(pic, txt("span", t.caption || (p ? p.title : "")));
    row.append(a);
  });
  grid.append(row);
});

/* index */
const list = document.getElementById("index-list");
C.projects.filter(p => !p.hidden).forEach(p => {
  const tr = document.createElement("tr");
  tr.className = "link";
  tr.addEventListener("click", () => location.hash = p.id);
  [p.title, p.type, p.lieu, p.annee].forEach(v => tr.append(txt("td", v)));
  list.append(tr);
});

/* info */
const info = document.getElementById("info");
C.info.intro.forEach(s => { const pEl = txt("p", ""); s.split("\n").forEach((line, i) => { if (i) pEl.append(document.createElement("br")); pEl.append(line); }); info.append(pEl); });
C.info.sections.forEach(sec => {
  info.append(txt("h3", sec.title));
  const ul = document.createElement("ul");
  sec.items.forEach(it => ul.append(txt("li", it)));
  info.append(ul);
});
if (C.info.photo) {
  // la photo commence à la hauteur de la liste de la rubrique choisie
  const lists = info.querySelectorAll(":scope > ul");
  const at = lists[Math.min(C.info.photoAt ?? 1, lists.length - 1)];
  const ph = img(C.info.photo, C.site.name); ph.className = "info-photo";
  info.classList.add("has-photo");
  if (at) {
    (at.previousElementSibling || at).before(ph);   // dans le texte (mobile) : avant le titre de la rubrique
    // sur ordinateur : en face de la liste (la photo, sortie du flux, ne compte pas dans les rangées)
    const kids = [...info.children], row = kids.indexOf(at);
    ph.style.gridRow = row + " / span " + (kids.length - row);
  }
  else info.append(ph);
}

/* liens du bas */
const links = document.getElementById("links");
C.links.forEach(l => {
  const a = txt("a", l.label); a.href = l.url;
  if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
  links.append(a);
});

/* page projet */
function renderProject(id) {
  const p = PROJECTS[id], el = document.getElementById("project");
  el.innerHTML = "";
  el.append(txt("h2", p.title));
  // sous-titre : une ligne par élément (avec lien facultatif), sinon le kicker, sinon type / lieu
  const subLines = (p.subtitle && p.subtitle.some(l => l.text))
    ? p.subtitle.filter(l => l.text)
    : (p.kicker ? p.kicker.split(" — ") : [p.type, p.lieu].filter(s => s && s !== "(...)")).map(text => ({ text }));
  const sub = txt("div", "", "sub");
  subLines.forEach(l => {
    const line = txt("div", "");
    if (l.url && !/^\s*javascript:/i.test(l.url)) {
      const a = txt("a", l.text); a.href = l.url;
      if (/^https?:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
      line.append(a);
    } else line.textContent = l.text;
    sub.append(line);
  });
  el.append(sub);

  if (p.images.length) {
    const g = txt("div", "", "gallery");
    p.images.forEach(f => g.append(img(f, p.title)));
    el.append(g);
  }

  // fiche technique : celle du projet, sinon construite depuis type / lieu / année
  const has = k => p.details.some(d => d.label === k);
  const details = p.details.map(d => [d.label, d.value]);
  if (p.lieu && p.lieu !== "(...)" && !has("Lieu") && !has("Évènement")) details.unshift(["Lieu", p.lieu]);
  if (p.type && !has("Type")) details.splice(details.findIndex(([d]) => d === "Lieu") + 1, 0, ["Type", p.type]);
  if (p.annee && !has("Date") && !has("Année")) details.push(["Année", p.annee]);

  const cols = txt("div", "", "cols");
  const t = txt("div", "", "text");
  p.text.forEach(s => t.append(txt("p", s)));
  if (p.link && p.link.url) { const l = txt("a", p.link.label || T.more, "more"); l.href = p.link.url; l.target = "_blank"; l.rel = "noopener"; t.append(l); }
  cols.append(t);
  if (details.length) {
    const dl = document.createElement("dl"); dl.className = "details ruled";
    details.forEach(([k, v]) => { const row = document.createElement("div"); row.append(txt("dt", k), txt("dd", v)); dl.append(row); });
    cols.append(dl);
  }
  el.append(cols);
  const b = txt("a", T.back, "back"); b.href = "#index"; el.append(b);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "atlas";
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  let navKey = id;
  if (PROJECTS[id]) { renderProject(id); document.getElementById("view-project").classList.add("active"); navKey = ""; }
  else (document.getElementById("view-" + id) || document.getElementById("view-atlas")).classList.add("active");
  document.querySelectorAll("nav a").forEach(a => {
    if (a.getAttribute("href") === "#" + navKey) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
